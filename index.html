<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Anyul Creation — Embroidery • Prints • Everyday Statements</title>
    <meta name="description" content="Embroidered and printed T-shirts and embroidered co-ord sets for men and women. Order directly on WhatsApp.">
    <meta name="theme-color" content="#181818">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --ink: #181818;
            --mut: #6b6b6b;
            --line: #e8e6e1;
            --soft: #f6f4ef;
            --gold: #b8923f;
           
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            font: 16px/1.6 'DM Sans',system-ui,sans-serif;
            color: var(--ink);
            background: #fff
        }

        a {
            color: inherit;
            text-decoration: none
        }

        button, select, input {
            font: inherit;
            color: inherit
        }

        button {
            cursor: pointer
        }

        img {
            display: block;
            max-width: 100%
        }

        .w {
            max-width: var(--max);
            margin: auto;
            padding: 0 20px
        }

        h1, h2, h3 {
            font-family: 'Playfair Display',Georgia,serif;
            font-weight: 500;
            line-height: 1.15;
            margin: 0
        }

        .eyebrow {
            font-size: 13px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 700
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 48px;
            padding: 0 28px;
            background: var(--ink);
            color: #fff;
            border: 1px solid var(--ink);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            transition: .2s
        }

            .btn:hover {
                background: var(--gold);
                border-color: var(--gold)
            }

            .btn.alt {
                background: #fff;
                color: var(--ink)
            }

                .btn.alt:hover {
                    background: var(--ink);
                    color: #fff
                }

            .btn.wa {
                background: #1f8f4e;
                border-color: #1f8f4e
            }

                .btn.wa:hover {
                    background: #17703d
                }

            .btn.block {
                width: 100%
            }

        :focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px
        }

        .top {
            background: var(--ink);
            color: #fff;
            text-align: center;
            font-size: 14px;
            padding: 9px 12px
        }

            .top a {
                color: #e6c67a;
                font-weight: 700
            }

        header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: #fff;
            border-bottom: 1px solid var(--line)
        }

        .hd {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 74px;
            gap: 16px
        }

        .logo img {
            height: 58px;
            width: 58px;
            object-fit: cover;
            border-radius: 50%
        }

        nav.main {
            display: flex;
            gap: 30px
        }

            nav.main a {
                font-size: 15px;
                font-weight: 500;
                padding: 6px 0;
                border-bottom: 2px solid transparent
            }

                nav.main a:hover, nav.main a.on {
                    border-color: var(--gold)
                }

        .ic {
            display: flex;
            gap: 6px
        }

        .ib {
            position: relative;
            width: 46px;
            height: 46px;
            border: 0;
            background: none;
            display: grid;
            place-items: center;
            border-radius: 50%
        }

            .ib:hover {
                background: var(--soft)
            }

            .ib svg {
                width: 24px;
                height: 24px
            }

        .badge {
            position: absolute;
            top: 3px;
            right: 1px;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            background: var(--gold);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            display: grid;
            place-items: center;
            padding: 0 5px
        }

            .badge:empty {
                display: none
            }

        #burger {
            display: none
        }

        .hero {
            position: relative;
            height: min(78vh,640px);
            min-height: 800px;
            background: #000;
            overflow: hidden
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity .8s
        }

            .slide.on {
                opacity: 1
            }

            .slide img {
                width: 100%;
                height: 100%;
            }

            .slide:after {
                content: '';
                position: absolute;
                inset: 0;
                background: linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.15) 65%)
            }

        .hcopy {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: #fff;
            max-width: 560px
        }

            .hcopy h1 {
                font-size: clamp(34px,5.5vw,62px);
                margin: 10px 0 14px
            }

            .hcopy p {
                font-size: 18px;
                color: #ddd;
                margin: 0 0 26px
            }

        .dots {
            position: absolute;
            z-index: 3;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 10px
        }

            .dots button {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                border: 1px solid #fff;
                background: none;
                padding: 0
            }

                .dots button.on {
                    background: #fff
                }

        .sec {
            padding: 64px 0
        }

        .sh {
            text-align: center;
            margin-bottom: 32px
        }

            .sh h2 {
                font-size: clamp(28px,3.6vw,40px);
                margin-top: 6px
            }

        .cols {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 280px 280px;
            gap: 16px
        }

        .col {
            position: relative;
            overflow: hidden;
            background: #222
        }

            .col.t {
                grid-column: 3;
                grid-row: 1/3
            }

            .col.all {
                grid-column: 1/3;
                grid-row: 2
            }

            .col img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: top;
                transition: transform .5s
            }

            .col:hover img {
                transform: scale(1.05)
            }

            .col:after {
                content: '';
                position: absolute;
                inset: 0;
                background: linear-gradient(0deg,rgba(0,0,0,.65),transparent 60%)
            }

        .cc {
            position: absolute;
            z-index: 2;
            left: 22px;
            bottom: 20px;
            color: #fff
        }

            .cc h3 {
                font-size: 28px;
                margin: 2px 0 8px
            }

            .cc span {
                font-size: 14px;
                font-weight: 700;
                letter-spacing: .08em;
                text-transform: uppercase;
                border-bottom: 2px solid var(--gold)
            }

        .grid {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 32px 20px
        }

        .card {
            display: block
        }

        .ci {
            position: relative;
            aspect-ratio: 2/3;
            overflow: hidden;
            background: var(--soft)
        }

            .ci img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: opacity .4s,transform .5s
            }

                .ci img + img {
                    opacity: 0
                }

        .card:hover .ci img + img {
            opacity: 1
        }

        .card:hover .ci img {
            transform: scale(1.03)
        }

        .tag {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 2;
            background: #fff;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: 4px 10px
        }

        .qa {
            position: absolute;
            z-index: 2;
            left: 10px;
            right: 10px;
            bottom: 10px;
            min-height: 44px;
            background: #fff;
            border: 0;
            font-weight: 700;
            font-size: 14px;
            opacity: 0;
            transform: translateY(8px);
            transition: .25s
        }

        .card:hover .qa {
            opacity: 1;
            transform: none
        }

        .cm {
            font-size: 13px;
            color: var(--mut);
            text-transform: uppercase;
            letter-spacing: .08em;
            margin-top: 12px
        }

        .cn {
            font-size: 17px;
            font-weight: 500;
            margin: 2px 0
        }

        .cp {
            font-weight: 700;
            font-size: 17px
        }

        .dots2 {
            display: flex;
            gap: 6px;
            margin-top: 8px
        }

            .dots2 i {
                width: 14px;
                height: 14px;
                border-radius: 50%;
                border: 1px solid #ccc
            }

        .split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: var(--ink);
            color: #fff
        }

            .split img {
                width: 100%;
                height: 100%;
                min-height: 420px;
                object-fit: cover;
                object-position: top
            }

        .sc {
            padding: 56px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start
        }

            .sc h2 {
                font-size: clamp(30px,4vw,46px);
                margin: 8px 0 16px
            }

            .sc p {
                color: #ccc;
                font-size: 18px;
                max-width: 440px;
                margin: 0 0 26px
            }

        .feat {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            border-block: 1px solid var(--line)
        }

            .feat div {
                padding: 30px 16px;
                text-align: center;
                border-right: 1px solid var(--line)
            }

                .feat div:last-child {
                    border: 0
                }

            .feat b {
                display: block;
                font-size: 17px
            }

            .feat span {
                color: var(--mut);
                font-size: 15px
            }

        footer {
            background: var(--ink);
            color: #fff;
            margin-top: 64px
        }

        .fg {
            display: grid;
            grid-template-columns: 1.6fr 1fr 1fr 1.2fr;
            gap: 36px;
            padding: 56px 20px 36px
        }

        footer img {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 12px
        }

        footer p {
            color: #bbb;
            font-size: 15px;
            max-width: 320px;
            margin: 0
        }

        footer h4 {
            font-size: 14px;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin: 0 0 14px
        }

        footer li {
            list-style: none;
            margin-bottom: 9px
        }

        footer ul {
            padding: 0;
            margin: 0
        }

        footer li a {
            color: #bbb;
            font-size: 15px
        }

            footer li a:hover {
                color: #e6c67a
            }

        .cp2 {
            border-top: 1px solid #333;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            color: #999;
            font-size: 14px
        }

        .head {
            background: var(--soft);
            text-align: center;
            padding: 44px 20px
        }

            .head h1 {
                font-size: clamp(32px,5vw,50px);
                margin-top: 6px
            }

            .head p {
                color: var(--mut);
                margin: 8px 0 0
            }

        .bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--line);
            margin-bottom: 28px
        }

        .chip {
            min-height: 44px;
            padding: 0 20px;
            border: 1px solid #cfcfcf;
            background: #fff;
            border-radius: 30px;
            font-size: 15px
        }

            .chip.on {
                background: var(--ink);
                color: #fff;
                border-color: var(--ink)
            }

        .bar select {
            min-height: 44px;
            border: 1px solid #cfcfcf;
            border-radius: 8px;
            padding: 0 12px;
            background: #fff;
            margin-left: auto
        }

        .cnt {
            color: var(--mut);
            font-size: 15px
        }

        .pp {
            display: grid;
            grid-template-columns: 1.15fr 1fr;
            gap: 48px;
            padding: 28px 0 20px
        }

        .bc {
            font-size: 14px;
            color: var(--mut);
            padding-top: 22px
        }

            .bc a:hover {
                color: var(--gold)
            }

        .gal {
            display: grid;
            grid-template-columns: 84px 1fr;
            gap: 12px
        }

        .th {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

            .th button {
                padding: 0;
                border: 2px solid transparent;
                background: var(--soft);
                aspect-ratio: 2/3;
                overflow: hidden
            }

                .th button.on {
                    border-color: var(--ink)
                }

            .th img, .mainimg img {
                width: 100%;
                height: 100%;
                object-fit: cover
            }

        .mainimg {
            aspect-ratio: 2/3;
            background: var(--soft);
            overflow: hidden
        }

        .info {
            position: sticky;
            top: 96px;
            align-self: start
        }

            .info h1 {
                font-size: clamp(28px,3.4vw,40px);
                margin: 8px 0 10px
            }

        .price {
            font-size: 26px;
            font-weight: 700
        }

        .tax {
            color: var(--mut);
            font-size: 14px
        }

        .lbl {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin: 24px 0 10px
        }

            .lbl span {
                font-weight: 400;
                color: var(--mut);
                text-transform: none;
                letter-spacing: 0
            }

        .sw {
            display: flex;
            gap: 12px;
            flex-wrap: wrap
        }

            .sw button {
                width: 44px;
                height: 44px;
                border-radius: 50%;
                border: 1px solid #ccc;
                padding: 0;
                box-shadow: inset 0 0 0 3px #fff
            }

                .sw button.on {
                    outline: 2px solid var(--ink);
                    outline-offset: 2px
                }

        .sz {
            display: flex;
            gap: 10px;
            flex-wrap: wrap
        }

            .sz button {
                min-width: 64px;
                min-height: 48px;
                border: 1px solid #cfcfcf;
                background: #fff;
                font-weight: 500
            }

                .sz button.on {
                    background: var(--ink);
                    color: #fff;
                    border-color: var(--ink)
                }

        .qty {
            display: inline-flex;
            align-items: center;
            border: 1px solid #cfcfcf
        }

            .qty button {
                width: 46px;
                height: 48px;
                border: 0;
                background: none;
                font-size: 22px
            }

            .qty b {
                min-width: 38px;
                text-align: center
            }

        .acts {
            display: grid;
            gap: 12px;
            margin-top: 26px
        }

        .row {
            display: flex;
            gap: 12px;
            align-items: center
        }

            .row .btn {
                flex: 1
            }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px
        }

        th, td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--line);
            text-align: left
        }

        th {
            background: var(--soft)
        }

        .tw {
            overflow-x: auto
        }

        details {
            border-top: 1px solid var(--line);
            margin-top: 24px;
            padding-top: 14px
        }

        summary {
            font-weight: 700;
            cursor: pointer;
            min-height: 36px
        }

        .ov {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            z-index: 80;
            display: none
        }

            .ov.on {
                display: block
            }

        .dr {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(440px,100%);
            background: #fff;
            display: flex;
            flex-direction: column;
            animation: in .25s
        }

        @keyframes in {
            from {
                transform: translateX(40px);
                opacity: 0
            }
        }

        .dh {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 22px;
            border-bottom: 1px solid var(--line)
        }

            .dh h3 {
                font-size: 24px
            }

        .db {
            flex: 1;
            overflow: auto;
            padding: 12px 22px
        }

        .df {
            padding: 20px 22px;
            border-top: 1px solid var(--line);
            display: grid;
            gap: 12px
        }

        .ln {
            display: grid;
            grid-template-columns: 84px 1fr;
            gap: 14px;
            padding: 16px 0;
            border-bottom: 1px solid var(--line)
        }

            .ln img {
                width: 84px;
                height: 126px;
                object-fit: cover
            }

            .ln small {
                color: var(--mut);
                font-size: 14px
            }

        .rm {
            border: 0;
            background: none;
            color: var(--mut);
            text-decoration: underline;
            font-size: 14px;
            padding: 6px 0
        }

        .tot {
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: 700
        }

        .sb {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: #fff;
            padding: 22px 0 26px;
            max-height: 100vh;
            overflow: auto
        }

            .sb input {
                width: 100%;
                height: 56px;
                border: 0;
                border-bottom: 2px solid var(--ink);
                font-size: 22px;
                outline: 0
            }

        .sr {
            display: flex;
            gap: 14px;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--line)
        }

            .sr img {
                width: 56px;
                height: 84px;
                object-fit: cover
            }

        .mm {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: min(340px,88vw);
            background: #fff;
            padding: 20px;
            animation: in .25s
        }

            .mm a {
                display: block;
                font: 500 26px 'Playfair Display',serif;
                padding: 12px 0;
                border-bottom: 1px solid var(--line)
            }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translate(-50%,120px);
            background: var(--ink);
            color: #fff;
            padding: 14px 22px;
            z-index: 120;
            transition: .3s;
            font-weight: 500;
            opacity: 0;
            pointer-events: none
        }

            .toast.on {
                transform: translate(-50%,0);
                opacity: 1
            }

        .wf {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 60;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #1f8f4e;
            color: #fff;
            display: grid;
            place-items: center;
            box-shadow: 0 6px 18px rgba(0,0,0,.3)
        }

            .wf svg {
                width: 30px;
                height: 30px
            }

        .ab {
            max-width: 720px;
            margin: auto;
            padding: 56px 20px;
            font-size: 18px;
            color: #444
        }

            .ab h1 {
                font-size: clamp(32px,5vw,48px);
                color: var(--ink);
                margin: 8px 0 18px
            }

        .empty {
            text-align: center;
            padding: 60px 0;
            color: var(--mut);
            grid-column: 1/-1
        }

        @media(max-width:900px) {
            nav.main {
                display: none
            }

            #burger {
                display: grid
            }

            .hd {
                height: 64px
            }

            .logo img {
                height: 48px;
                width: 48px
            }

            .grid {
                grid-template-columns: repeat(2,1fr);
                gap: 26px 12px
            }

            .cols {
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 220px 220px;
                gap: 12px
            }

            .col.t {
                grid-column: 1/3;
                grid-row: 3
            }

            .col.all {
                grid-column: 1/3;
                grid-row: 2
            }

            .split {
                grid-template-columns: 1fr
            }

                .split img {
                    min-height: 340px
                }

            .sc {
                padding: 36px 22px
            }

            .feat {
                grid-template-columns: 1fr 1fr
            }

                .feat div:nth-child(2) {
                    border-right: 0
                }

                .feat div:nth-child(-n+2) {
                    border-bottom: 1px solid var(--line)
                }

            .fg {
                grid-template-columns: 1fr 1fr
            }

                .fg > div:first-child {
                    grid-column: 1/3
                }

            .pp {
                grid-template-columns: 1fr;
                gap: 24px
            }

            .info {
                position: static
            }

            .sec {
                padding: 44px 0
            }

            .hero {
                height: 520px
            }

            .slide:after {
                background: linear-gradient(0deg,rgba(0,0,0,.85),rgba(0,0,0,.05) 65%)
            }

            .hcopy {
                justify-content: flex-end;
                padding-bottom: 56px
            }

            .slide img {
                object-position: 88% top !important
            }

            .gal {
                grid-template-columns: 1fr
            }

            .th {
                flex-direction: row;
                order: 2;
                overflow-x: auto
            }

                .th button {
                    width: 72px;
                    flex: none
                }

            .qa {
                display: none
            }

            .cn {
                font-size: 16px
            }

            .bar select {
                margin-left: 0
            }
        }
    
/* ===== ON THE RAIL ===== */
.rr{position:relative;background:linear-gradient(#f8f4ea,#f4eee1);overflow:hidden;padding:clamp(52px,7vw,96px) 0 clamp(40px,5vw,72px);scroll-margin-top:84px}
.rr-head{text-align:center;padding:0 20px;margin-bottom:clamp(18px,3vw,38px)}
